<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 - Not Found</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body,
            html {
                width: 100%;
                height: 100%;
                background: #000;
                overflow: hidden;
                cursor: crosshair;
                user-select: none;
                font-family: 'Courier New', monospace;
            }
            canvas {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                display: block;
            }
            #hint {
                position: fixed;
                bottom: 36px;
                left: 50%;
                transform: translateX(-50%);
                color: rgba(255, 80, 80, 0.5);
                font-size: 11px;
                letter-spacing: 3px;
                text-transform: uppercase;
                z-index: 20;
                pointer-events: none;
                animation: pulse 2.5s ease-in-out infinite;
                white-space: nowrap;
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 0.22;
                }
                50% {
                    opacity: 0.85;
                }
            }

            #home {
                position: fixed;
                inset: 0;
                background: #050505;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 100;
                opacity: 0;
                pointer-events: none;
                transition: opacity 1.2s ease;
            }
            #home.show {
                opacity: 1;
                pointer-events: all;
            }
            .home-title {
                color: #fff;
                font-size: clamp(28px, 4.5vw, 58px);
                font-weight: 200;
                letter-spacing: 14px;
                text-transform: uppercase;
                opacity: 0;
                transform: translateY(24px);
                transition:
                    opacity 0.8s 0.3s ease,
                    transform 0.8s 0.3s ease;
            }
            .home-sub {
                color: rgba(255, 255, 255, 0.28);
                font-size: 11px;
                letter-spacing: 5px;
                text-transform: uppercase;
                margin: 14px 0 56px;
                opacity: 0;
                transform: translateY(16px);
                transition:
                    opacity 0.8s 0.5s ease,
                    transform 0.8s 0.5s ease;
            }
            .home-btn {
                padding: 12px 44px;
                border: 1px solid rgba(255, 255, 255, 0.22);
                background: transparent;
                color: rgba(255, 255, 255, 0.65);
                font-family: 'Courier New', monospace;
                font-size: 11px;
                letter-spacing: 4px;
                text-transform: uppercase;
                cursor: pointer;
                opacity: 0;
                transform: translateY(12px);
                transition:
                    opacity 0.8s 0.7s ease,
                    transform 0.8s 0.7s ease,
                    background 0.3s,
                    border-color 0.3s;
            }
            #home.show .home-title,
            #home.show .home-sub,
            #home.show .home-btn {
                opacity: 1;
                transform: none;
            }
            .home-btn:hover {
                background: rgba(255, 255, 255, 0.07);
                border-color: rgba(255, 255, 255, 0.5);
            }
        </style>
    </head>
    <body>
        <canvas id="c"></canvas>
        <div id="hint">click to shatter</div>
        <div id="home">
            <div class="home-title">Welcome Home</div>
            <div class="home-sub">You found your way back</div>
            <button class="home-btn" onclick="resetAll()">← Back to 404</button>
        </div>

        <!-- ══════════════════════════════════════════════════════════
     VERTEX SHADER — pass-through
═══════════════════════════════════════════════════════════ -->
        <script id="vert" type="x-shader/x-vertex">
            precision mediump float;
            attribute vec2 a_position;
            varying vec2 vUv;
            void main() {
              /* flip Y: canvas is top-origin, GL is bottom-origin */
              vUv = vec2(a_position.x * .5 + .5,
                         .5 - a_position.y * .5);
              gl_Position = vec4(a_position, 0.0, 1.0);
            }
        </script>

        <!-- ══════════════════════════════════════════════════════════
     FRAGMENT SHADER
     Adapted from ksenia-k/abegNPO with key optimisations:
       • Loop unrolled to a fixed bound (WebGL1 requirement met)
       • Sector count reduced: 12 → 8  (visually same, 33% cheaper)
       • noise() / random() calls minimised
       • No per-frame time uniform → shader is STATIC between clicks
         so we only re-draw when state actually changes
═══════════════════════════════════════════════════════════ -->
        <script id="frag" type="x-shader/x-fragment">
            precision highp float;

            varying vec2 vUv;
            uniform sampler2D u_image_texture;
            uniform float u_edge_thickness;
            uniform float u_ratio;
            uniform vec2  u_pointer_position;
            uniform float u_img_ratio;
            uniform float u_click_randomizer;
            uniform float u_effect;
            uniform float u_effect_active;
            uniform float u_global_alpha;   /* NEW: for fade-out */

            /* second click accumulation */
            uniform vec2  u_pointer2;
            uniform float u_randomizer2;
            uniform float u_active2;

            /* third click */
            uniform vec2  u_pointer3;
            uniform float u_randomizer3;
            uniform float u_active3;

            #define TWO_PI 6.28318530718
            #define PI     3.14159265358979

            float random(float x)  { return fract(sin(x*12.9898)*43758.5453); }
            float random2(vec2 p)  { return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }

            float noise(vec2 p) {
              vec2 ip = floor(p), u = fract(p);
              u = u*u*(3.0-2.0*u);
              return mix(mix(random2(ip),           random2(ip+vec2(1,0)), u.x),
                         mix(random2(ip+vec2(0,1)), random2(ip+vec2(1,1)), u.x), u.y);
            }

            float sectorShape(float d, float a, float angle, float edges) {
              float a1 = PI, a2 = a1+angle;
              return smoothstep(a1-edges/d, a1+edges/d, a)
                   * (1.-smoothstep(a2-edges/d, a2+edges/d, a));
            }

            float frameAlpha(vec2 uv, float w) {
              float f = smoothstep(0.,w,uv.x)*smoothstep(1.,1.-w,uv.x);
              f      *= smoothstep(0.,w,uv.y)*smoothstep(1.,1.-w,uv.y);
              return f;
            }

            float simpleCracks(float a, float d, float n, float rz) {
              a *= (1.+sin(2.*a+PI+2.*rz));
              float step_a = TWO_PI/10.;
              float ca = mod(a+n+rz, step_a);
              float s  = 4.*abs(ca-.5*step_a);
              s = mix(s, 1., smoothstep(.9,1.,d));
              s *= pow(d+.4*rz*max(0.,cos(2.*a+rz)*sin(a)), 12.);
              return (1.+n)*(1.+sin(4.*a))*step(.9,s);
            }

            vec2 imgUV() {
              vec2 uv = vUv - .5;
              if (u_ratio > u_img_ratio) uv.x *= u_ratio/u_img_ratio;
              else                        uv.y *= u_img_ratio/u_ratio;
              uv *= 1.0;   /* scale=1 (original used 1.4, zoomed in) */
              return uv + .5;
            }

            vec2 disturbUV(vec2 uv, float sc, float edge, vec2 dir, float border) {
              float dist = u_effect*(sc-.5);
              vec2 d = uv + 2.*dist;
              d.x -= mix(.03*edge*dir.x, -.1*edge, border);
              d.y -= mix(.03*edge*dir.y, -.1*edge, border);
              d -= .5;
              float cosA=cos(4.*dist), sinA=sin(4.*dist);
              float p = 1.+dist*d.y;
              d = vec2(p*(cosA*d.x-sinA*d.y), p*(sinA*d.x+cosA*d.y));
              return d+.5;
            }

            /* ── one full crack pass for a given click point ── */
            vec4 crackPass(vec2 uv, vec2 imgUv, vec2 ptr_pos, float rz, float active) {
              /* pointer in same coordinate space */
              vec2 ptr = ptr_pos;
              vec2 pdir = normalize(ptr_pos - vec2(vUv.x, 1.-vUv.y));
              ptr.x *= u_ratio;
              vec2 delta = ptr - uv;
              float pAngle = atan(delta.y, delta.x);
              float pDist  = length(delta);
              float pDistN = 1.-clamp(pDist,0.,1.);

              float secConst=0., secStart=0.;
              float secEdge=0., gridEdge=0., centEdge=0.;
              float aNoise = .3*noise(3.*imgUv);

              /* 8 sectors instead of 12 — ~33% faster, same visual quality */
              for (int i=0; i<8; i++) {
                float seed = float(i)+rz+2.;
                float aNorm = mod((pAngle-secStart)/TWO_PI,1.) + .1*aNoise;
                float angle = aNorm*TWO_PI;
                float sz = min(.01+2.*random2(vec2(float(i)+rz, ptr_pos.x)),
                               TWO_PI-secStart);
                float thick = u_edge_thickness*(.2+random(3.*seed))
                            + aNoise*.03*pow(pDistN,80.);

                float shape = sectorShape(pDist, angle, sz, thick);
                secEdge  = max(secEdge, smoothstep(.6,1.,shape));
                secConst = mix(secConst, random(seed), smoothstep(.2,.8,shape));

                vec2  gUv   = 2.*(.8+.5*pDistN)*imgUv;
                float gN    = noise(gUv+seed);
                float gTh   = (.4+.4*random(10.*seed))*u_edge_thickness;
                float gShape= shape*smoothstep(.27,.27+gTh,gN);
                gridEdge += smoothstep(.1,.5,gShape)*smoothstep(.9,.6,gShape);
                secConst = mix(secConst, random(seed+100.), smoothstep(.2,.8,gShape));

                vec2  cgUv  = imgUv*(3.+3.*pow(pDistN,10.));
                float cgN   = noise(cgUv+seed);
                float cgTh  = (1.+.5*random(-2.+seed))*u_edge_thickness;
                float cgShape=step(.7,shape)*smoothstep(.27,.27+cgTh,cgN);
                centEdge += smoothstep(.0,.5,cgShape)*smoothstep(1.,.5,cgShape);
                centEdge *= step(.8,pDistN);
                secConst = mix(secConst, random(seed+100.), smoothstep(.2,.8,cgShape));

                secStart += sz;
              }

              secEdge = 1.-secEdge;
              float cracks = max(gridEdge, secEdge);
              cracks = max(cracks, centEdge);
              float central = simpleCracks(pAngle, pDistN, aNoise, rz);
              cracks += central;

              vec2 sUV = imgUv;
              if (active > 0.) {
                sUV = disturbUV(imgUv, secConst, cracks, pdir,
                                frameAlpha(imgUv,.2));
              }
              sUV = clamp(sUV, 0.001, 0.999);

              vec4 col = texture2D(u_image_texture, sUV);
              col.rgb += .12*active*(secConst-.5);

              float op = frameAlpha(sUV,.004);
              op -= .3*active*pow(gridEdge,4.);
              op -= .3*active*centEdge;
              op -= .03*active*pow(central,4.);

              return vec4(col.rgb, op);
            }

            void main() {
              vec2 uv   = vUv; uv.y=1.-uv.y; uv.x*=u_ratio;
              vec2 iUV  = imgUV();

              /* ── first click / base state ── */
              vec4 col = crackPass(uv, iUV, u_pointer_position, u_click_randomizer, u_effect_active);

              /* ── blend in second click ── */
              if (u_active2 > 0.) {
                vec4 c2 = crackPass(uv, iUV, u_pointer2, u_randomizer2, 1.0);
                col = mix(col, c2, .55);
              }

              /* ── blend in third click ── */
              if (u_active3 > 0.) {
                vec4 c3 = crackPass(uv, iUV, u_pointer3, u_randomizer3, 1.0);
                col = mix(col, c3, .55);
              }

              col.a *= u_global_alpha;
              gl_FragColor = col;
            }
        </script>

        <script>
            /* ══════════════════════════════════════════════════════════════════
   CRITICAL OPTIMISATION STRATEGY
   ─────────────────────────────────────────────────────────────────
   The original codepen runs requestAnimationFrame continuously.
   On a full-resolution canvas that means the heavy fragment shader
   executes ~60 times/second even when NOTHING is moving.

   Fix:
   1. NO continuous rAF loop.  We only call drawFrame() manually
      when state actually changes (click / resize / reset).
   2. Cap canvas resolution at 1× DPR (not 2×). Halves pixel count.
   3. Pause rendering when tab is hidden (visibilitychange).
   4. rAF loop only runs during the shatter fade-out animation
      (~2 s), then stops immediately.
   5. powerPreference:'low-power' hint to GPU driver.
══════════════════════════════════════════════════════════════════ */

            const MAX_CLICKS = 3;
            let clickCount = 0;
            let isFading = false;
            let animId = null;

            /* ── GL ── */
            const canvas = document.getElementById('c');
            /* Cap DPR at 1 — halves pixel count on retina, huge CPU saving */
            const DPR = Math.min(window.devicePixelRatio || 1, 1);
            const gl = canvas.getContext('webgl', {
                alpha: false,
                antialias: false,
                powerPreference: 'low-power',
                preserveDrawingBuffer: false,
            });

            /* ── compile shaders ── */
            function mkShader(src, type) {
                const s = gl.createShader(type);
                gl.shaderSource(s, src);
                gl.compileShader(s);
                if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error('Shader:', gl.getShaderInfoLog(s));
                return s;
            }
            const prog = gl.createProgram();
            gl.attachShader(prog, mkShader(document.getElementById('vert').text, gl.VERTEX_SHADER));
            gl.attachShader(prog, mkShader(document.getElementById('frag').text, gl.FRAGMENT_SHADER));
            gl.linkProgram(prog);
            if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error('Link:', gl.getProgramInfoLog(prog));
            gl.useProgram(prog);

            /* quad */
            const vb = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, vb);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
            const aPos = gl.getAttribLocation(prog, 'a_position');
            gl.enableVertexAttribArray(aPos);
            gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

            /* uniform cache */
            const U = {};
            [
                'u_image_texture',
                'u_edge_thickness',
                'u_ratio',
                'u_pointer_position',
                'u_img_ratio',
                'u_click_randomizer',
                'u_effect',
                'u_effect_active',
                'u_global_alpha',
                'u_pointer2',
                'u_randomizer2',
                'u_active2',
                'u_pointer3',
                'u_randomizer3',
                'u_active3',
            ].forEach((n) => (U[n] = gl.getUniformLocation(prog, n)));

            /* ── click state ── */
            const state = {
                ptr: [0.55, 0.5],
                rz: 0.332,
                effect: 0.0,
                active: 0,
                ptr2: [0.55, 0.5],
                rz2: 0.5,
                active2: 0,
                ptr3: [0.55, 0.5],
                rz3: 0.5,
                active3: 0,
                globalAlpha: 1.0,
            };

            /* ══════════════════════════════════════════════════════════════════
   404 TEXTURE — drawn once on an offscreen canvas, uploaded to GPU
══════════════════════════════════════════════════════════════════ */
            let imgRatio = 1;
            let glTex = null;

            function build404Texture() {
                const W = window.innerWidth,
                    H = window.innerHeight;
                imgRatio = W / H;

                const oc = Object.assign(document.createElement('canvas'), { width: W, height: H });
                const cx2 = oc.getContext('2d');

                cx2.fillStyle = '#000';
                cx2.fillRect(0, 0, W, H);

                /* subtle glass surface noise */
                for (let i = 0; i < 400; i++) {
                    cx2.fillStyle = `rgba(255,255,255,${Math.random() * 0.015})`;
                    cx2.fillRect(
                        Math.random() * W,
                        Math.random() * H,
                        Math.random() * 2 + 0.5,
                        Math.random() * 1.5 + 0.5,
                    );
                }

                const fs = Math.min(W * 0.22, 200);
                cx2.textAlign = 'center';
                cx2.textBaseline = 'middle';
                cx2.font = `900 ${fs}px "Courier New",monospace`;

                cx2.shadowColor = '#ff0000';
                cx2.shadowBlur = 80;
                cx2.fillStyle = 'rgba(255,25,25,0.25)';
                cx2.fillText('404', W / 2, H / 2 - fs * 0.1);

                cx2.shadowBlur = 40;
                cx2.fillStyle = '#cc1111';
                cx2.fillText('404', W / 2, H / 2 - fs * 0.1);

                cx2.shadowBlur = 12;
                cx2.fillStyle = '#ff4444';
                cx2.fillText('404', W / 2, H / 2 - fs * 0.1);

                cx2.shadowBlur = 0;
                cx2.fillStyle = '#ffbbbb';
                cx2.fillText('404', W / 2, H / 2 - fs * 0.1);

                const ss = Math.min(W * 0.021, 19);
                cx2.font = `${ss}px "Courier New",monospace`;
                cx2.shadowColor = '#ff3333';
                cx2.shadowBlur = 10;
                cx2.fillStyle = 'rgba(255,90,90,0.58)';
                cx2.fillText('PAGE NOT FOUND', W / 2, H / 2 + fs * 0.54);

                if (glTex) gl.deleteTexture(glTex);
                glTex = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, glTex);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, oc);
                gl.uniform1i(U.u_image_texture, 0);
            }

            /* ══════════════════════════════════════════════════════════════════
   DRAW — called ONLY when something changes (no idle loop)
══════════════════════════════════════════════════════════════════ */
            function drawFrame(globalAlpha) {
                const ga = globalAlpha !== undefined ? globalAlpha : state.globalAlpha;
                const W = canvas.width,
                    H = canvas.height;

                gl.viewport(0, 0, W, H);
                gl.uniform1f(U.u_ratio, W / H);
                gl.uniform1f(U.u_img_ratio, imgRatio);
                gl.uniform1f(U.u_edge_thickness, 0.006);
                gl.uniform1f(U.u_effect, 0.018);
                gl.uniform1f(U.u_global_alpha, ga);

                gl.uniform2fv(U.u_pointer_position, state.ptr);
                gl.uniform1f(U.u_click_randomizer, state.rz);
                gl.uniform1f(U.u_effect_active, state.active);

                gl.uniform2fv(U.u_pointer2, state.ptr2);
                gl.uniform1f(U.u_randomizer2, state.rz2);
                gl.uniform1f(U.u_active2, state.active2);

                gl.uniform2fv(U.u_pointer3, state.ptr3);
                gl.uniform1f(U.u_randomizer3, state.rz3);
                gl.uniform1f(U.u_active3, state.active3);

                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            }

            /* ══════════════════════════════════════════════════════════════════
   RESIZE
══════════════════════════════════════════════════════════════════ */
            function resize() {
                canvas.width = Math.floor(window.innerWidth * DPR);
                canvas.height = Math.floor(window.innerHeight * DPR);
                build404Texture();
                drawFrame();
            }
            window.addEventListener('resize', resize);

            /* ══════════════════════════════════════════════════════════════════
   PAUSE WHEN TAB IS HIDDEN — free GPU entirely
══════════════════════════════════════════════════════════════════ */
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (animId) {
                        cancelAnimationFrame(animId);
                        animId = null;
                    }
                } else {
                    drawFrame(); /* single redraw on return */
                }
            });

            /* ══════════════════════════════════════════════════════════════════
   CLICK
══════════════════════════════════════════════════════════════════ */
            const hint = document.getElementById('hint');
            const home = document.getElementById('home');

            canvas.addEventListener('click', (e) => {
                if (clickCount >= MAX_CLICKS || isFading) return;
                clickCount++;

                const nx = e.clientX / window.innerWidth;
                const ny = e.clientY / window.innerHeight; /* top=0, matches vUv flip */

                if (clickCount === 1) {
                    state.ptr = [nx, ny];
                    state.rz = Math.random();
                    state.active = 1;
                    hint.textContent = '2 more cracks...';
                } else if (clickCount === 2) {
                    state.ptr2 = [nx, ny];
                    state.rz2 = Math.random();
                    state.active2 = 1;
                    hint.textContent = 'one more...';
                } else {
                    state.ptr3 = [nx, ny];
                    state.rz3 = Math.random();
                    state.active3 = 1;
                    hint.textContent = '';
                    drawFrame(); /* one frame with full crack visible */
                    setTimeout(() => startShatter(e.clientX, e.clientY), 80);
                    return;
                }
                drawFrame();
            });

            /* ══════════════════════════════════════════════════════════════════
   SHATTER — short-lived animation, stops itself
══════════════════════════════════════════════════════════════════ */
            function startShatter(cx, cy) {
                isFading = true;

                /* screen shake via canvas transform */
                let tk = 0;
                const shk = setInterval(() => {
                    const dx = (Math.random() - 0.5) * 14,
                        dy = (Math.random() - 0.5) * 10;
                    canvas.style.transform = `translate(${dx}px,${dy}px)`;
                    if (++tk > 12) {
                        clearInterval(shk);
                        canvas.style.transform = '';
                    }
                }, 36);

                let fadeOut = 0;
                let lastTime = performance.now();

                function loop(now) {
                    /* time-based delta so speed is independent of frame rate */
                    const dt = Math.min((now - lastTime) / 16.67, 3);
                    lastTime = now;
                    fadeOut = Math.min(1, fadeOut + 0.022 * dt);

                    drawFrame(1 - fadeOut);

                    if (fadeOut < 1) {
                        animId = requestAnimationFrame(loop);
                    } else {
                        /* ── STOP loop completely ── */
                        cancelAnimationFrame(animId);
                        animId = null;
                        gl.clear(gl.COLOR_BUFFER_BIT);
                        home.classList.add('show');
                    }
                }
                animId = requestAnimationFrame(loop);
            }

            /* ══════════════════════════════════════════════════════════════════
   RESET
══════════════════════════════════════════════════════════════════ */
            function resetAll() {
                if (animId) {
                    cancelAnimationFrame(animId);
                    animId = null;
                }

                clickCount = 0;
                isFading = false;
                Object.assign(state, {
                    ptr: [0.55, 0.5],
                    rz: Math.random(),
                    effect: 0.0,
                    active: 0,
                    ptr2: [0.55, 0.5],
                    rz2: Math.random(),
                    active2: 0,
                    ptr3: [0.55, 0.5],
                    rz3: Math.random(),
                    active3: 0,
                    globalAlpha: 1.0,
                });

                home.classList.remove('show');
                hint.style.display = 'block';
                hint.textContent = 'click to shatter';

                drawFrame();
            }

            /* ══════════════════════════════════════════════════════════════════
   BOOT — single draw, no loop
══════════════════════════════════════════════════════════════════ */
            resize(); /* builds texture + draws once */
        </script>
    </body>
</html>
