<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Not Found</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body, html {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: crosshair;
  }

  #bg-layer {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 0;
  }

  #error-text {
    color: #ff1a1a;
    font-size: clamp(80px, 18vw, 200px);
    font-weight: 900;
    letter-spacing: -4px;
    text-shadow:
      0 0 20px rgba(255, 26, 26, 0.8),
      0 0 60px rgba(255, 26, 26, 0.4),
      0 0 120px rgba(255, 26, 26, 0.2);
    user-select: none;
    animation: glitch 4s infinite;
    line-height: 1;
  }

  #error-sub {
    color: #ff4444;
    font-size: clamp(14px, 2.5vw, 24px);
    letter-spacing: 6px;
    text-transform: uppercase;
    opacity: 0.7;
    user-select: none;
  }

  @keyframes glitch {
    0%, 90%, 100% { transform: none; filter: none; }
    91% { transform: skewX(-2deg) translateX(-3px); filter: blur(1px); }
    92% { transform: skewX(2deg) translateX(3px); color: #00ffff; filter: none; }
    93% { transform: none; color: #ff1a1a; }
    95% { transform: translateX(-2px); filter: blur(0.5px); }
    96% { transform: translateX(2px); }
    97% { transform: none; }
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    cursor: crosshair;
  }

  #click-hint {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 80, 80, 0.5);
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    z-index: 20;
    pointer-events: none;
    animation: fadeHint 2s ease-in-out infinite;
    user-select: none;
  }

  @keyframes fadeHint {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }

  #click-counter {
    position: fixed;
    top: 30px;
    right: 30px;
    color: rgba(255, 60, 60, 0.6);
    font-size: 12px;
    letter-spacing: 2px;
    z-index: 20;
    pointer-events: none;
    user-select: none;
  }

  /* Home screen */
  #home-screen {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
  }

  #home-screen.visible {
    opacity: 1;
    pointer-events: all;
  }

  .home-title {
    color: #fff;
    font-size: clamp(32px, 5vw, 64px);
    font-weight: 300;
    letter-spacing: 12px;
    text-transform: uppercase;
    margin-bottom: 16px;
    animation: slideUp 0.8s ease both;
  }

  .home-sub {
    color: rgba(255,255,255,0.35);
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 60px;
    animation: slideUp 0.8s 0.15s ease both;
  }

  .home-btn {
    padding: 14px 48px;
    border: 1px solid rgba(255,255,255,0.3);
    background: transparent;
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    animation: slideUp 0.8s 0.3s ease both;
  }

  .home-btn:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.6);
    box-shadow: 0 0 30px rgba(255,255,255,0.1);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Crack effect overlay canvas uses glass image of the 404 screen */
  #crack-canvas {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- Black background with 404 -->
<div id="bg-layer">
  <div id="error-text">404</div>
  <div id="error-sub">Page Not Found</div>
</div>

<div id="click-hint">click to shatter</div>
<div id="click-counter" id="counter-display"></div>

<!-- WebGL canvas for glass effect -->
<canvas id="glcanvas"></canvas>

<!-- Home screen revealed after 3 clicks -->
<div id="home-screen">
  <div class="home-title">Welcome Home</div> 
  <button class="home-btn" onclick="resetPage()">← Back to 404</button>
</div>

<!-- Vertex Shader -->
<script type="x-shader/x-fragment" id="vertShader">
  precision mediump float;
  varying vec2 vUv;
  attribute vec2 a_position;
  void main() {
    vUv = .5 * (a_position + 1.);
    gl_Position = vec4(a_position, 0.0, 1.0);
  }
</script>

<!-- Fragment Shader (glass crack) -->
<script type="x-shader/x-fragment" id="fragShader">
  precision highp float;
  precision highp sampler2D;

  varying vec2 vUv;
  uniform sampler2D u_image_texture;
  uniform float u_edge_thickness;
  uniform float u_ratio;
  uniform vec2 u_pointer_position;
  uniform float u_img_ratio;
  uniform float u_click_randomizer;
  uniform float u_rotation;
  uniform float u_effect;
  uniform float u_effect_active;
  uniform float u_opacity;

  #define TWO_PI 6.28318530718
  #define PI 3.14159265358979323846

  float random(float x) {
    return fract(sin(x * 12.9898) * 43758.5453);
  }

  float random2(vec2 p) {
    return fract(sin(dot(p.xy, vec2(12.9898, 78.233))) * 43758.5453);
  }

  float noise(vec2 p) {
    vec2 ip = floor(p);
    vec2 u = fract(p);
    u = u*u*(3.0-2.0*u);
    float res = mix(
      mix(random2(ip), random2(ip+vec2(1.0,0.0)), u.x),
      mix(random2(ip+vec2(0.0,1.0)), random2(ip+vec2(1.0,1.0)), u.x), u.y);
    return res*res;
  }

  float get_sector_shape(float d, float a, float angle, float edges) {
    float angle1 = PI;
    float angle2 = angle1 + angle;
    float edge1 = smoothstep(angle1 - edges/d, angle1 + edges/d, a);
    float edge2 = smoothstep(angle2 - edges/d, angle2 + edges/d, a);
    return edge1 * (1. - edge2);
  }

  float get_img_frame_alpha(vec2 uv, float w) {
    float a = smoothstep(0., w, uv.x) * smoothstep(1., 1.-w, uv.x);
    a *= smoothstep(0., w, uv.y) * smoothstep(1., 1.-w, uv.y);
    return a;
  }

  float get_simple_cracks(float a, float d, float n) {
    a *= (1. + sin(2.*a + PI + 2.*u_click_randomizer));
    float num = 10.;
    float step_a = TWO_PI / num;
    float crack_a = mod(a + n + u_click_randomizer, step_a);
    float shape = 4. * abs(crack_a - .5 * step_a);
    shape = mix(shape, 1., smoothstep(.9, 1., d));
    shape *= pow(d + .4*u_click_randomizer*max(0., cos(2.*a+u_click_randomizer)*sin(a)), 12.);
    shape = (1.+n)*(1.+sin(4.*a))*step(.9, shape);
    return shape;
  }

  vec2 get_img_uv() {
    vec2 uv = vUv;
    uv -= .5;
    if (u_ratio > u_img_ratio) {
      uv.x = uv.x * u_ratio / u_img_ratio;
    } else {
      uv.y = uv.y * u_img_ratio / u_ratio;
    }
    uv *= 1.0;
    uv += .5;
    uv.y = 1. - uv.y;
    return uv;
  }

  vec2 get_disturbed_uv(vec2 uv, float sc, float edge, vec2 dir, float border) {
    float dist = u_effect * (sc - .5);
    vec2 duv = uv;
    duv += 2.*dist;
    duv.x -= mix(.03*edge*dir.x, -.1*edge, border);
    duv.y -= mix(.03*edge*dir.y, -.1*edge, border);
    vec2 c = vec2(.5,.5);
    duv -= c;
    float cosA = cos(4.*dist);
    float sinA = sin(4.*dist);
    float persp = 1. + dist * duv.y;
    duv = vec2(persp*(cosA*duv.x - sinA*duv.y), persp*(sinA*duv.x + cosA*duv.y));
    duv += c;
    return duv;
  }

  void main() {
    vec2 uv = vUv;
    uv.y = 1. - uv.y;
    uv.x *= u_ratio;

    vec2 ptr = u_pointer_position;
    vec2 ptr_dir = normalize(u_pointer_position - vec2(vUv.x, 1.-vUv.y));
    ptr.x *= u_ratio;
    ptr -= uv;
    float ptr_angle = atan(ptr.y, ptr.x);
    float ptr_dist = length(ptr);
    float ptr_dist_n = 1. - clamp(ptr_dist, 0., 1.);

    vec3 color = vec3(0.);
    vec2 img_uv = get_img_uv();

    float sec_const = 0.;
    float sec_start = 0.;
    float sec_edge = 0.;
    float grid_edge = 0.;
    float cent_edge = 0.;

    float angle_noise = .3 * noise(3. * img_uv);

    for (int i = 0; i < 12; i++) {
      float seed = float(i) + u_click_randomizer + 2.;
      float a_norm = mod((ptr_angle - sec_start) / TWO_PI, 1.);
      a_norm += .1 * angle_noise;
      float angle = a_norm * TWO_PI;
      float sec_size = (.01 + 2. * random2(vec2(float(i)+u_click_randomizer, u_pointer_position.x)));
      sec_size = min(sec_size, TWO_PI - sec_start);

      float thick = u_edge_thickness * (.2 + random(3.*seed));
      thick += angle_noise * .03 * pow(ptr_dist_n, 80.);

      float shape = get_sector_shape(ptr_dist, angle, sec_size, thick);
      sec_edge = max(sec_edge, smoothstep(.6, 1., shape));
      sec_const = mix(sec_const, random(seed), smoothstep(.2, .8, shape));

      vec2 grid_uv = 2.*(.8+.5*ptr_dist_n)*img_uv;
      float grid_noise = noise(grid_uv + seed);
      float grid_thick = (.4+.4*random(10.*seed))*u_edge_thickness;
      float grid_shape = shape * smoothstep(.27, .27+grid_thick, grid_noise);
      grid_edge += smoothstep(.1,.5,grid_shape)*smoothstep(.9,.6,grid_shape);
      sec_const = mix(sec_const, random(seed+100.), smoothstep(.2,.8,grid_shape));

      vec2 cgrid_uv = img_uv*(3.+3.*pow(ptr_dist_n,10.));
      float cgrid_noise = noise(cgrid_uv+seed);
      float cgrid_thick = (1.+.5*random(-2.+seed))*u_edge_thickness;
      float cgrid_shape = step(.7,shape)*smoothstep(.27,.27+cgrid_thick,cgrid_noise);
      cent_edge += smoothstep(.0,.5,cgrid_shape)*smoothstep(1.,.5,cgrid_shape);
      cent_edge *= step(.8, ptr_dist_n);
      sec_const = mix(sec_const, random(seed+100.), smoothstep(.2,.8,cgrid_shape));

      sec_start += sec_size;
    }

    sec_edge = 1. - sec_edge;
    float cracks = max(grid_edge, sec_edge);
    cracks = max(cracks, cent_edge);

    float central = get_simple_cracks(ptr_angle, ptr_dist_n, angle_noise);
    cracks += central;

    if (u_effect_active > 0.) {
      img_uv = get_disturbed_uv(img_uv, sec_const, cracks, ptr_dir, get_img_frame_alpha(img_uv, .2));
    }

    vec4 img = texture2D(u_image_texture, img_uv);
    color = img.rgb;
    color += .12 * u_effect_active * (sec_const - .5);

    float opacity = get_img_frame_alpha(img_uv, .004);
    opacity -= .3 * u_effect_active * pow(grid_edge, 4.);
    opacity -= .3 * u_effect_active * cent_edge;
    opacity -= .03 * u_effect_active * pow(central, 4.);
    opacity *= u_opacity;

    gl_FragColor = vec4(color, opacity);
  }
</script>

<script>
const canvas = document.getElementById('glcanvas');
const homeScreen = document.getElementById('home-screen');
const hint = document.getElementById('click-hint');
const counterEl = document.getElementById('click-counter');

const dpr = Math.min(window.devicePixelRatio, 2);
let clickCount = 0;
let image, uniforms, gl;
let glassOpacity = 1.0;
let isBreaking = false;

// Click positions for each crack
const clicks = [];

const params = {
  clickRandomizer: 0.5,
  distance: 0.018,
  effectOn: true,
  edgeThickness: 0.007,
};

const pointer = {
  x: window.innerWidth * 0.5,
  y: window.innerHeight * 0.5,
};

function initWebGL() {
  const vsSource = document.getElementById('vertShader').innerHTML;
  const fsSource = document.getElementById('fragShader').innerHTML;
  gl = canvas.getContext('webgl');
  if (!gl) return;

  function makeShader(src, type) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, makeShader(vsSource, gl.VERTEX_SHADER));
  gl.attachShader(prog, makeShader(fsSource, gl.FRAGMENT_SHADER));
  gl.linkProgram(prog);

  uniforms = {};
  const n = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(prog, i).name;
    uniforms[name] = gl.getUniformLocation(prog, name);
  }

  const verts = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
  gl.useProgram(prog);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
}

function updateUniforms() {
  if (!gl || !uniforms) return;
  gl.uniform1f(uniforms.u_click_randomizer, params.clickRandomizer);
  gl.uniform1f(uniforms.u_rotation, 0);
  gl.uniform1f(uniforms.u_effect, params.distance);
  gl.uniform1f(uniforms.u_effect_active, params.effectOn ? 1 : 0);
  gl.uniform1f(uniforms.u_edge_thickness, params.edgeThickness);
  gl.uniform1f(uniforms.u_opacity, glassOpacity);
  gl.uniform2f(uniforms.u_pointer_position, pointer.x / window.innerWidth, pointer.y / window.innerHeight);
}

// Create a texture from the current screen (404 text rendered to offscreen canvas)
function create404Texture() {
  const offscreen = document.createElement('canvas');
  offscreen.width = window.innerWidth;
  offscreen.height = window.innerHeight;
  const ctx = offscreen.getContext('2d');

  // Black background
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, offscreen.width, offscreen.height);

  // Add some subtle texture to the glass
  for (let i = 0; i < 800; i++) {
    ctx.fillStyle = `rgba(20,20,20,${Math.random() * 0.3})`;
    ctx.fillRect(Math.random() * offscreen.width, Math.random() * offscreen.height, Math.random() * 3 + 1, Math.random() * 3 + 1);
  }

  const fontSize = Math.min(offscreen.width * 0.22, 200);
  ctx.font = `900 ${fontSize}px "Courier New", monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Glow effect
  ctx.shadowColor = '#ff1a1a';
  ctx.shadowBlur = 40;
  ctx.fillStyle = '#ff2222';
  ctx.fillText('404', offscreen.width / 2, offscreen.height / 2 - fontSize * 0.15);

  ctx.shadowBlur = 80;
  ctx.fillStyle = '#ff0000';
  ctx.fillText('404', offscreen.width / 2, offscreen.height / 2 - fontSize * 0.15);

  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ff4444';
  ctx.fillText('404', offscreen.width / 2, offscreen.height / 2 - fontSize * 0.15);

  // Sub text
  const subSize = Math.min(offscreen.width * 0.025, 24);
  ctx.font = `${subSize}px "Courier New", monospace`;
  ctx.letterSpacing = '6px';
  ctx.shadowColor = '#ff4444';
  ctx.shadowBlur = 15;
  ctx.fillStyle = 'rgba(255,80,80,0.7)';
  ctx.fillText('PAGE NOT FOUND', offscreen.width / 2, offscreen.height / 2 + fontSize * 0.55);

  // Load as WebGL texture
  image = { naturalWidth: offscreen.width, naturalHeight: offscreen.height };
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, offscreen);
  gl.uniform1i(uniforms.u_image_texture, 0);

  resizeCanvas();
}

function resizeCanvas() {
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  if (gl) {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform1f(uniforms.u_ratio, canvas.width / canvas.height);
    gl.uniform1f(uniforms.u_img_ratio, (image ? image.naturalWidth / image.naturalHeight : 1));
  }
}

function render() {
  if (gl) {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  requestAnimationFrame(render);
}

function updateCounter() {
  const remaining = 3 - clickCount;
  if (clickCount === 0) {
    counterEl.textContent = '';
  } else {
    counterEl.textContent = `CRACKS: ${clickCount}/3`;
  }
}

function handleClick(e) {
  if (clickCount >= 3 || isBreaking) return;

  clickCount++;
  const x = e.clientX;
  const y = e.clientY;

  clicks.push({ x, y, randomizer: Math.random() });

  pointer.x = x;
  pointer.y = y;
  params.clickRandomizer = Math.random();

  // Progressively increase crack effect
  if (clickCount === 1) {
    params.edgeThickness = 0.006;
    params.distance = 0.018;
  } else if (clickCount === 2) {
    params.edgeThickness = 0.012;
    params.distance = 0.03;
  } else if (clickCount === 3) {
    params.edgeThickness = 0.018;
    params.distance = 0.05;
    // Final shatter
    shattering();
  }

  updateUniforms();
  updateCounter();

  // Update hint
  if (clickCount === 1) {
    hint.textContent = '2 more cracks...';
  } else if (clickCount === 2) {
    hint.textContent = 'one more...';
  }

  // Visual click ripple
  spawnClickRipple(x, y);
}

function spawnClickRipple(x, y) {
  const div = document.createElement('div');
  div.style.cssText = `
    position:fixed; left:${x}px; top:${y}px;
    width:4px; height:4px; border-radius:50%;
    background: rgba(255,50,50,0.9);
    transform: translate(-50%,-50%);
    pointer-events:none; z-index:50;
    box-shadow: 0 0 12px rgba(255,50,50,0.8);
    animation: ripple 0.5s ease-out forwards;
  `;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 500);
}

// Add ripple keyframes
const style = document.createElement('style');
style.textContent = `
  @keyframes ripple {
    from { width:4px; height:4px; opacity:1; }
    to { width:60px; height:60px; opacity:0; transform:translate(-50%,-50%); }
  }
`;
document.head.appendChild(style);

function shattering() {
  isBreaking = true;
  hint.style.display = 'none';
  counterEl.style.display = 'none';
  canvas.style.pointerEvents = 'none';

  // Shake effect
  document.body.style.animation = 'shake 0.4s ease';
  const shakeStyle = document.createElement('style');
  shakeStyle.textContent = `
    @keyframes shake {
      0%,100%{transform:none}
      10%{transform:translate(-6px,-3px) rotate(-0.5deg)}
      20%{transform:translate(6px,3px) rotate(0.5deg)}
      30%{transform:translate(-4px,5px) rotate(-0.3deg)}
      40%{transform:translate(4px,-5px) rotate(0.3deg)}
      50%{transform:translate(-8px,2px)}
      60%{transform:translate(8px,-2px)}
      70%{transform:translate(-3px,6px)}
      80%{transform:translate(3px,-6px)}
      90%{transform:translate(-2px,2px)}
    }
  `;
  document.head.appendChild(shakeStyle);

  // Fade out glass and fade in home
  let opacity = 1.0;
  const fadeInterval = setInterval(() => {
    opacity -= 0.02;
    glassOpacity = Math.max(0, opacity);
    updateUniforms();

    if (opacity <= 0) {
      clearInterval(fadeInterval);
      // Show home screen
      homeScreen.classList.add('visible');
      canvas.style.display = 'none';
      document.getElementById('bg-layer').style.display = 'none';
    }
  }, 16);
}

function resetPage() {
  clickCount = 0;
  isBreaking = false;
  glassOpacity = 1.0;
  params.edgeThickness = 0.007;
  params.distance = 0.018;
  params.clickRandomizer = 0.5;
  pointer.x = window.innerWidth * 0.5;
  pointer.y = window.innerHeight * 0.5;

  homeScreen.classList.remove('visible');
  canvas.style.display = 'block';
  canvas.style.pointerEvents = 'all';
  document.getElementById('bg-layer').style.display = 'flex';
  hint.style.display = 'block';
  hint.textContent = 'click to shatter';
  counterEl.style.display = 'block';
  counterEl.textContent = '';
  document.body.style.animation = '';

  updateUniforms();
}

// Init
initWebGL();
updateUniforms();
create404Texture();
canvas.addEventListener('click', handleClick);
window.addEventListener('resize', () => {
  create404Texture();
  resizeCanvas();
  updateUniforms();
});
render();
</script>
</body>
</html>
